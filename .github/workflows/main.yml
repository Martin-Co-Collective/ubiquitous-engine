name: CI Build and Test Pipeline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-11-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Instant System Diagnostics
        shell: powershell
        run: |
          Write-Host "================ SYSTEM SPECS ================"
          # Instant registry query instead of slow WMI/CIM
          $cpuName = (Get-ItemProperty -Path "HKLM:\HARDWARE\DESCRIPTION\System\CentralProcessor\0" -ErrorAction SilentlyContinue).ProcessorNameString
          if (-not $cpuName) { $cpuName = (Get-ItemProperty -Path "HKLM:\HARDWARE\DESCRIPTION\System\CentralProcessor\0" -ErrorAction SilentlyContinue).Identifier }

          # Instant .NET calls
          $logicalCores = [Environment]::ProcessorCount
          $ramBytes = (New-Object Microsoft.VisualBasic.Devices.ComputerInfo).TotalPhysicalMemory
          $ramGB = [math]::Round($ramBytes / 1GB, 2)

          # Instant local drive check
          $freeDisk = [math]::Round((Get-PSDrive C).Free / 1GB, 2)

          Write-Host "CPU Model       : $cpuName"
          Write-Host "Logical Cores   : $logicalCores"
          Write-Host "Total RAM       : $ramGB GB"
          Write-Host "C: Drive Free   : $freeDisk GB"
          Write-Host "Architecture    : $env:PROCESSOR_ARCHITECTURE"
          Write-Host "=============================================="

      - name: Instant Background Disk Cleanup
        shell: powershell
        run: |
          Write-Host "Spawning async disk purger..."
          Start-Job -ScriptBlock {
              $ErrorActionPreference = 'SilentlyContinue'
              $targets = @(
                  "$env:ANDROID_HOME",
                  "C:\Program Files (x86)\Android",
                  "C:\Program Files\Java",
                  "C:\Strawberry",
                  "C:\ProgramData\DockerDesktop",
                  "C:\Program Files\Microsoft Service Fabric",
                  "C:\Program Files\PostgreSQL",
                  "C:\ProgramData\Chocolatey",
                  "$env:USERPROFILE\.rustup",
                  "$env:USERPROFILE\.cargo"
              )
              foreach ($t in $targets) {
                  if (Test-Path $t) {
                      cmd.exe /c "rd /s /q `"$t`"" 2>$null
                  }
              }
              cmd.exe /c "del /f /s /q `"%TEMP%\*.*`"" 2>$null
          } | Out-Null
          Write-Host "Cleanup dispatched. Moving to network setup."

      - name: Configure Network Services
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ErrorActionPreference = 'Stop'

          Write-Host "Locating Tailscale ARM64 MSI package..."
          $html = (Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/" -UseBasicParsing).Content
          if ($html -match 'href="(?<url>[^"]*tailscale-setup-[0-9\.]+-arm64\.msi)"') {
              $msiFile = $Matches['url']
              $msiUrl = "https://pkgs.tailscale.com/stable/" + $msiFile
          } else {
              # Fallback ARM64 release
              $msiUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.80.3-arm64.msi"
          }

          Write-Host "Downloading $msiUrl ..."
          (New-Object System.Net.WebClient).DownloadFile($msiUrl, "tailscale-arm64.msi")

          Write-Host "Installing Tailscale silently for ARM64..."
          Start-Process msiexec.exe -ArgumentList "/i tailscale-arm64.msi /qn /norestart" -Wait -NoNewWindow

          # Start Tailscale service explicitly
          Start-Service -Name "Tailscale" -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 4

          Write-Host "Connecting to Tailscale..."
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey "$env:TAILSCALE_AUTHKEY" --hostname "build-agent-arm-01" --timeout=60s

      - name: Initialize System Environment
        shell: powershell
        run: |
          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

          # Strip UI animations and bloat
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'UserPreferencesMask' -Value ([byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00))
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop\WindowMetrics' -Name 'MinAnimate' -Value '0'
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name 'VisualFXSetting' -Value 2

          # Create user credentials
          $user = "RDPUser"
          $password = ConvertTo-SecureString "StrongPass123!" -AsPlainText -Force
          New-LocalUser -Name $user -Password $password -Description "Build Runner Access"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user
          Add-LocalGroupMember -Group "Administrators" -Member $user

          # Safe polling for IP (won't crash on null/empty strings)
          $tsIp = ""
          for ($i = 0; $i -lt 15; $i++) {
              $rawIp = & "C:\Program Files\Tailscale\tailscale.exe" ip -4 2>$null
              if ($rawIp) {
                  $tsIp = $rawIp.Trim()
                  break
              }
              Start-Sleep -Seconds 2
          }

          if (-not $tsIp) {
              $tsIp = "Pending / Check Tailscale Admin Console"
          }

          Write-Host "=========================================="
          Write-Host " ENVIRONMENT READY FOR ACCESS"
          Write-Host " Hostname / IP : $tsIp (or build-agent-arm-01)"
          Write-Host " Username      : $user"
          Write-Host " Password      : StrongPass123!"
          Write-Host "=========================================="

      - name: Run Build Tasks
        shell: powershell
        run: |
          Write-Host "Build workload active. Pipeline standing by."
          Start-Sleep -Seconds 21600
